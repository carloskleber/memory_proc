[project]
name = "memory-proc"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "marker-pdf>=1.10.2",
    # Listed directly so the CUDA source override below actually binds —
    # uv only applies [tool.uv.sources] to direct dependencies, not transitive.
    "torch>=2.0",
    "torchvision",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

